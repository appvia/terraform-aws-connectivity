---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  examples:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Module Examples
    with:
      working-directory: examples/inspection

  module-inspection:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Inspection Connectivity
    with:
      working-directory: modules/inspection

  module-trusted:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Trusted Connectivity
    with:
      working-directory: modules/trusted
